name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      agent_message:
        description: 'Message from orchestrating agent'
        required: false
        type: string
      run_tests:
        description: 'Run full test suite'
        required: false
        default: true
        type: boolean

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # pincher-core's sandbox test asserts `config.use_bwrap || config.use_landlock`.
      # use_bwrap is `which_bwrap().is_some()` and use_landlock is `cfg!(feature =
      # "landlock")` with `default = []` -- so on a stock runner BOTH are false and the
      # assertion can never pass. It has been red since 2026-06-06. Installing the
      # mechanism makes the environment match what the test requires; it does not
      # weaken the assertion.
      - name: Install bubblewrap (required by the sandbox test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap && bwrap --version

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt --check
